<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">BatteryCare</title><desc id="desc">A rainbow battery with a white charging bolt on a pearl rounded square.</desc>
<defs>
